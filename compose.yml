name: finpay

x-app: &app
  build:
    context: .
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-environment: &environment
  DB_PASSWORD: ${FINPAY_DB_PASSWORD:?Set FINPAY_DB_PASSWORD in .env}
  KAFKA_BOOTSTRAP: kafka:9092
  JWT_ISSUER: http://localhost:8180/realms/finpay
  JWT_JWKS: http://keycloak:8080/realms/finpay/protocol/openid-connect/certs

x-database: &database
  image: postgres:17.6-alpine
  restart: unless-stopped
  healthcheck:
    test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
    interval: 5s # Quick local readiness detection, not a production probe policy.
    timeout: 3s
    retries: 20

services:
  wallet-db:
    <<: *database
    environment: {POSTGRES_USER: wallet, POSTGRES_DB: wallet, POSTGRES_PASSWORD: '${FINPAY_DB_PASSWORD}'}
    volumes: [wallet-data:/var/lib/postgresql/data]
  payment-db:
    <<: *database
    environment: {POSTGRES_USER: payment, POSTGRES_DB: payment, POSTGRES_PASSWORD: '${FINPAY_DB_PASSWORD}'}
    volumes: [payment-data:/var/lib/postgresql/data]
  ledger-db:
    <<: *database
    environment: {POSTGRES_USER: ledger, POSTGRES_DB: ledger, POSTGRES_PASSWORD: '${FINPAY_DB_PASSWORD}'}
    volumes: [ledger-data:/var/lib/postgresql/data]
  notification-db:
    <<: *database
    environment: {POSTGRES_USER: notification, POSTGRES_DB: notification, POSTGRES_PASSWORD: '${FINPAY_DB_PASSWORD}'}
    volumes: [notification-data:/var/lib/postgresql/data]
  intelligence-db:
    <<: *database
    environment: {POSTGRES_USER: intelligence, POSTGRES_DB: intelligence, POSTGRES_PASSWORD: '${FINPAY_DB_PASSWORD}'}
    volumes: [intelligence-data:/var/lib/postgresql/data]

  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list']
      interval: 10s # KRaft startup needs more time than a database readiness check.
      timeout: 10s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${FINPAY_IDP_PASSWORD:?Set FINPAY_IDP_PASSWORD in .env}
      KC_HOSTNAME: http://localhost:8180
    ports: ['127.0.0.1:8180:8080']
    volumes:
      - ./infra/realm.json:/opt/keycloak/data/import/realm.json:ro
      - identity-data:/opt/keycloak/data

  wallet:
    <<: *app
    build: {context: ., args: {SERVICE: wallet-service}}
    environment:
      <<: *environment
      APP_NAME: wallet-service
      DB_URL: jdbc:postgresql://wallet-db:5432/wallet
      DB_USER: wallet
      SANDBOX_FUNDING: 'true' # Local simulated funds only; application default is false.
    depends_on: {wallet-db: {condition: service_healthy}, kafka: {condition: service_healthy}, keycloak: {condition: service_started}}
  payment:
    <<: *app
    build: {context: ., args: {SERVICE: payment-service}}
    environment:
      <<: *environment
      APP_NAME: payment-service
      DB_URL: jdbc:postgresql://payment-db:5432/payment
      DB_USER: payment
    depends_on: {payment-db: {condition: service_healthy}, kafka: {condition: service_healthy}, keycloak: {condition: service_started}}
  ledger:
    <<: *app
    build: {context: ., args: {SERVICE: ledger-service}}
    environment:
      <<: *environment
      APP_NAME: ledger-service
      DB_URL: jdbc:postgresql://ledger-db:5432/ledger
      DB_USER: ledger
    depends_on: {ledger-db: {condition: service_healthy}, kafka: {condition: service_healthy}, keycloak: {condition: service_started}}
  notification:
    <<: *app
    build: {context: ., args: {SERVICE: notification-service}}
    environment:
      <<: *environment
      APP_NAME: notification-service
      DB_URL: jdbc:postgresql://notification-db:5432/notification
      DB_USER: notification
    depends_on: {notification-db: {condition: service_healthy}, kafka: {condition: service_healthy}, keycloak: {condition: service_started}}
  intelligence:
    <<: *app
    build: {context: ., args: {SERVICE: intelligence-service}}
    environment:
      <<: *environment
      APP_NAME: intelligence-service
      DB_URL: jdbc:postgresql://intelligence-db:5432/intelligence
      DB_USER: intelligence
      AI_ENABLED: ${AI_ENABLED:-false}
      OLLAMA_BASE_URL: http://ollama:11434
      AI_MODEL: ${AI_MODEL:-qwen2.5:1.5b}
    depends_on: {intelligence-db: {condition: service_healthy}, kafka: {condition: service_healthy}, keycloak: {condition: service_started}}

  ollama:
    image: ollama/ollama:0.13.5
    profiles: [ai]
    environment:
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1' # One local inference at a time avoids CPU/RAM overload.
      OLLAMA_MAX_LOADED_MODELS: '1'
    volumes: [ollama-data:/root/.ollama]
    # No published port: inference is reachable only on the Compose network.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  valkey:
    image: valkey/valkey:8.1.3-alpine
    command: [valkey-server, --save, '', --appendonly, 'no', --maxmemory, 128mb, --maxmemory-policy, noeviction]
    # Tokens are deliberately not persisted; a restart requires users to sign in again.
    networks: [sessions]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    <<: *app
    build: {context: ./frontend}
    networks: [default, sessions]
    environment:
      APP_ORIGIN: http://localhost:8080
      BACKEND_ORIGIN: http://gateway:8080
      OIDC_ISSUER: http://localhost:8180/realms/finpay
      OIDC_INTERNAL_ORIGIN: http://keycloak:8080
      OIDC_CLIENT_ID: finpay-web
      REDIS_URL: redis://valkey:6379
      NEXT_TELEMETRY_DISABLED: '1'
    depends_on: {valkey: {condition: service_healthy}, keycloak: {condition: service_started}}

  gateway:
    image: nginxinc/nginx-unprivileged:1.28.0-alpine
    ports: ['127.0.0.1:8080:8080']
    volumes: ['./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [wallet, payment, ledger, notification, intelligence, frontend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  wallet-data:
  payment-data:
  ledger-data:
  notification-data:
  intelligence-data:
  kafka-data:
  identity-data:
  ollama-data:

networks:
  sessions:
    internal: true
