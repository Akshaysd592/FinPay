# Local per-IP limit: protects demo endpoints without pretending to be account-level fraud control.
map $uri $finpay_rate_key {
    default $binary_remote_addr;
    ~^/_next/static/ "";
}
limit_req_zone $finpay_rate_key zone=finpay_api:10m rate=10r/s;
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 16k;
    limit_req zone=finpay_api burst=30 nodelay;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Request-ID $request_id always;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    # Financial writes are never automatically retried by the proxy.
    proxy_next_upstream off;
    location /api/wallets { proxy_pass http://wallet:8080; }
    location /api/payments { proxy_pass http://payment:8080; }
    location /api/ledger { proxy_pass http://ledger:8080; }
    location /api/notifications { proxy_pass http://notification:8080; }
    location /api/insights { proxy_pass http://intelligence:8080; }
    location = /healthz { return 200 'gateway ready\n'; }
    # Avoid rate-limiting a page's immutable JS/CSS asset fan-out as API traffic.
    location /_next/static/ { proxy_pass http://frontend:3000; }
    location / { proxy_pass http://frontend:3000; }
}
