plugins {
    id 'org.springframework.boot' version '4.1.1' apply false
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'jacoco'
    group = 'dev.finpay'
    version = '0.1.0'

    java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
    tasks.withType(JavaCompile).configureEach { options.release = 21; options.compilerArgs += '-parameters' }
    dependencies {
        implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
        testImplementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.springframework.security:spring-security-test'
        testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
        testImplementation 'org.testcontainers:postgresql:1.21.4'
        testImplementation 'org.testcontainers:kafka:1.21.4'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.named('test') { useJUnitPlatform { excludeTags 'integration' }; finalizedBy 'jacocoTestReport' }
    tasks.register('integrationTest', Test) {
        description = 'Runs PostgreSQL/Kafka tests; requires Docker.'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform { includeTags 'integration' }
        shouldRunAfter tasks.named('test')
    }
    if (name != 'platform') {
        apply plugin: 'org.springframework.boot'
        dependencies { implementation project(':platform') }
        tasks.named('bootJar') { archiveFileName = 'app.jar' }
    }
}

project(':platform') {
    dependencies {
        api 'org.springframework.boot:spring-boot-starter-webmvc'
        api 'org.springframework.boot:spring-boot-starter-data-jpa'
        api 'org.springframework.boot:spring-boot-starter-security'
        api 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
        api 'org.springframework.boot:spring-boot-starter-validation'
        api 'org.springframework.boot:spring-boot-starter-actuator'
        api 'org.springframework.boot:spring-boot-starter-kafka'
        api 'org.springframework.boot:spring-boot-starter-flyway'
        api 'io.micrometer:micrometer-registry-prometheus'
        api 'org.flywaydb:flyway-database-postgresql'
        // Fixed patched driver version, independent of the platform BOM.
        api 'org.postgresql:postgresql:42.7.12'
    }
}
